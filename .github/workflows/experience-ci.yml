name: Experience CI

on:
  pull_request:
    paths:
      - "prisma/**"
      - "src/modules/evaluation-harness/**"
      - "src/modules/product-development/potential-assessment.ts"
      - "src/modules/advisor/proposals.ts"
      - "src/modules/advisor/service.ts"
      - "src/modules/assistant-runtime/**"
      - "src/modules/visual-intelligence/**"
      - "src/app/muse/**"
      - "tests/regression-harness-experience.ts"
      - "tests/regression-kern-product-conversation-continuity.ts"
      - "tests/regression-kern-product-rnd-chat.ts"
      - "tests/regression-kern-collaboration-planner.ts"
      - "tests/regression-kern-visual-intelligence.ts"
      - "tests/kern-autonomy-policy.test.ts"
      - "tests/kern-project-map.ts"
      - "tests/kern-runtime-architecture.test.ts"
      - "tests/kern-goal-plan.test.ts"
      - "tests/kern-conversation-controls.test.ts"
      - "src/modules/worker/generic-agent-contracts.ts"
      - "src/modules/worker/generic-executor.ts"
      - "src/modules/attention/**"
      - "src/modules/workforce/activity-brief.ts"
      - "tests/kern-generic-executor.test.ts"
      - "tests/kern-attention-engine.test.ts"
      - "package.json"
      - ".github/workflows/experience-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "prisma/**"
      - "src/modules/evaluation-harness/**"
      - "src/modules/product-development/potential-assessment.ts"
      - "src/modules/advisor/proposals.ts"
      - "src/modules/advisor/service.ts"
      - "src/modules/assistant-runtime/**"
      - "src/modules/visual-intelligence/**"
      - "src/app/muse/**"
      - "tests/regression-harness-experience.ts"
      - "tests/regression-kern-product-conversation-continuity.ts"
      - "tests/regression-kern-product-rnd-chat.ts"
      - "tests/regression-kern-collaboration-planner.ts"
      - "tests/regression-kern-visual-intelligence.ts"
      - "tests/kern-autonomy-policy.test.ts"
      - "tests/kern-project-map.ts"
      - "tests/kern-runtime-architecture.test.ts"
      - "tests/kern-conversation-controls.test.ts"
      - "src/modules/worker/generic-agent-contracts.ts"
      - "src/modules/worker/generic-executor.ts"
      - "src/modules/attention/**"
      - "src/modules/workforce/activity-brief.ts"
      - "tests/kern-generic-executor.test.ts"
      - "tests/kern-attention-engine.test.ts"
      - "package.json"
      - ".github/workflows/experience-ci.yml"

jobs:
  experience:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hermes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hermes_test:hermes_test@localhost:5432/hermes_test
      TEST_DATABASE_URL: postgresql://hermes_test:hermes_test@localhost:5432/hermes_test
      TEST_DB_ROLE: hermes_test
      DEV_DATABASE_GUARD_URL: postgresql://postgres:postgres@localhost:5432/hermes_dev_guard
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Provision isolated test role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE hermes_test LOGIN PASSWORD 'hermes_test'"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER DATABASE hermes_test OWNER TO hermes_test"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE hermes_dev_guard"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "REVOKE CONNECT ON DATABASE hermes_dev_guard FROM PUBLIC"

      - run: npx prisma generate
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm run test:experience
      - name: Verify Kern product conversation continuity
        run: npx tsx scripts/run-test.ts tests/regression-kern-product-conversation-continuity.ts
      - name: Verify Kern can explicitly start Product R&D
        run: npx tsx scripts/run-test.ts tests/regression-kern-product-rnd-chat.ts
      - name: Verify Kern collaboration planner shadow
        run: npx tsx tests/regression-kern-collaboration-planner.ts
      - name: Verify Kern visual intelligence graph contract
        run: npm run test:visual-intelligence
      - name: Verify Kern conversation autonomy policy
        run: npm run test:kern-autonomy
      - name: Verify Kern source-backed project map
        run: npm run test:kern-project-map
      - name: Verify Kern runtime architecture contract
        run: npm run test:kern-runtime-architecture
      - name: Verify Kern GoalPlan DAG contract
        run: npm run test:kern-goal-plan
      - name: Verify Kern conversation controls
        run: npm run test:kern-conversation-controls
      - name: Verify Kern Generic Agent Executor contracts
        run: npm run test:kern-generic-executor
      - name: Verify Kern Attention Engine protocol
        run: npm run test:kern-attention
