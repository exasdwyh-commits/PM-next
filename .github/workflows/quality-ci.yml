name: Quality CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hermes_typecheck

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:ci-contracts
      - run: npm run test:tenant
      - name: Validate local Laya runtime syntax
        run: python3 -m py_compile services/judgment-runtime/service.py
      - run: npm run test:golden
      - run: npm run test:potential
      - run: npm run test:channel-routes
      - run: npm run test:model-gateway
      - run: npm run test:model-control
      - run: npm run test:model-runtime
      - run: npm run test:harness
      - run: npm run test:validation-decision
      - run: npm run test:decision-intelligence
      - run: npm run test:fusion-core
      - run: npm run test:launch-auth
      - run: npm run test:frontend-v3
      - run: npm run test:healthcare-innovation
      - run: npm run test:report-format
      - run: npm run test:report-quality
      - run: npm run test:flow-zoom
      - run: npm run test:role-callout-radius
      - run: npm run test:token-usage
      - run: npm run test:desktop-runtime
      - run: npm run test:kern-project-map
      - run: npm run test:regression-units
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  report-theme-contrast:
    # T19：报告卡/结论卡在明暗 × 三角色 × 多宽度下的真实组件对比度探针（离线渲染，不需要数据库）。
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:report-theme-contrast
      - name: Upload theme contrast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-theme-contrast
          path: outputs/block-1-theme/fixed/
          if-no-files-found: ignore
