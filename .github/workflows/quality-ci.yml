name: Quality CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hermes_typecheck

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - name: Validate local Laya runtime syntax
        run: python3 -m py_compile services/judgment-runtime/service.py
      - run: npm run test:golden
      - run: npm run test:potential
      - run: npm run test:channel-routes
      - run: npm run test:model-gateway
      - run: npm run test:model-control
      - run: npm run test:model-runtime
      - run: npm run test:harness
      - run: npm run test:validation-decision
      - run: npm run test:decision-intelligence
      - run: npm run test:fusion-core
      - run: npm run test:launch-auth
      - run: npm run test:frontend-v3
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
