name: Kern Supervisor CI

on:
  pull_request:
    paths:
      - "prisma/**"
      - "src/modules/supervisor/**"
      - "src/modules/workforce/**"
      - "src/modules/worker/**"
      - "src/modules/assistant-runtime/**"
      - "src/app/api/missions/**"
      - "tests/regression-kern-supervisor.ts"
      - "tests/regression-kern-memory-quota.ts"
      - "tests/regression-kern-mission-controls.ts"
      - "tests/kern-mission-controls.test.ts"
      - "tests/kern-mission-timeline.test.ts"
      - "tests/kern-brief.test.ts"
      - "tests/regression-kern-brief.ts"
      - "tests/regression-kern-takeaway.ts"
      - "tests/kern-report.test.ts"
      - "src/app/muse/**"
      - "src/modules/muse/**"
      - "src/modules/memory/**"
      - "src/modules/billing/**"
      - "tests/kern-supervisor-plan.test.ts"
      - "package.json"
      - ".github/workflows/kern-supervisor-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "prisma/**"
      - "src/modules/supervisor/**"
      - "src/modules/workforce/**"
      - "src/modules/worker/**"
      - "src/modules/assistant-runtime/**"
      - "src/app/api/missions/**"
      - "tests/regression-kern-supervisor.ts"
      - "tests/regression-kern-memory-quota.ts"
      - "tests/regression-kern-mission-controls.ts"
      - "tests/kern-mission-controls.test.ts"
      - "tests/kern-mission-timeline.test.ts"
      - "tests/kern-brief.test.ts"
      - "tests/regression-kern-brief.ts"
      - "tests/regression-kern-takeaway.ts"
      - "tests/kern-report.test.ts"
      - "src/app/muse/**"
      - "src/modules/muse/**"
      - "src/modules/memory/**"
      - "src/modules/billing/**"
      - "tests/kern-supervisor-plan.test.ts"
      - "package.json"
      - ".github/workflows/kern-supervisor-ci.yml"

jobs:
  supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hermes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hermes_test:hermes_test@localhost:5432/hermes_test
      TEST_DATABASE_URL: postgresql://hermes_test:hermes_test@localhost:5432/hermes_test
      TEST_DB_ROLE: hermes_test
      DEV_DATABASE_GUARD_URL: postgresql://postgres:postgres@localhost:5432/hermes_dev_guard
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Provision isolated test role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE hermes_test LOGIN PASSWORD 'hermes_test'"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER DATABASE hermes_test OWNER TO hermes_test"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE hermes_dev_guard"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "REVOKE CONNECT ON DATABASE hermes_dev_guard FROM PUBLIC"

      - run: npx prisma generate
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm run test:kern-supervisor-plan
      - run: npm run test:kern-supervisor
      - run: npm run test:kern-memory-quota
      - run: npm run test:kern-mission-controls
      - run: npm run test:kern-brief
      - run: npm run test:kern-takeaway
      - run: npm run test:workforce
      - run: npm run test:golden-org
