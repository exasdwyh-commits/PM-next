<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kern · 回复呈现框架 v1</title>
<style>
/* ═══════════════════════════════════════════════════════════
   KERN RESPONSE FRAMEWORK — design tokens
   ═══════════════════════════════════════════════════════════ */
:root{
  --ink-900:#0f1116; --ink-800:#1b1f27; --ink-700:#333944; --ink-600:#4b525f;
  --ink-500:#6b7280; --ink-400:#9099a6; --ink-300:#c3c9d2;
  --line:#e7e9ef; --line-soft:#f0f2f6;
  --paper:#ffffff; --canvas:#f6f7f9; --sunk:#fafbfc;

  --brand:#4338ca; --brand-ink:#3730a3; --brand-soft:#eef0ff; --brand-line:#d6d9ff;
  --ok:#0b7a4f; --ok-soft:#e8f6ef; --ok-line:#bfe6d4;
  --warn:#9a5b06; --warn-soft:#fdf3e2; --warn-line:#f2ddb6;
  --bad:#b32b23; --bad-soft:#fdeeec; --bad-line:#f6cdc8;
  --demo:#6d28d9; --demo-soft:#f4efff; --demo-line:#ddd0fb;

  --r-sm:8px; --r:12px; --r-lg:18px;
  --sp:8px;
  --measure:68ch;
  --shadow-1:0 1px 2px rgba(16,20,32,.05), 0 1px 1px rgba(16,20,32,.03);
  --shadow-2:0 4px 16px rgba(16,20,32,.07), 0 1px 3px rgba(16,20,32,.05);
  --font: "Inter","SF Pro Text",-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono: "SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink-900:#f2f4f8; --ink-800:#e5e8ef; --ink-700:#cbd1dc; --ink-600:#aab2c0;
    --ink-500:#8a93a3; --ink-400:#6e7788; --ink-300:#4a5262;
    --line:#252a34; --line-soft:#1d222b;
    --paper:#141821; --canvas:#0d1017; --sunk:#11151d;
    --brand:#9d97ff; --brand-ink:#b7b2ff; --brand-soft:#1d1e3a; --brand-line:#32346a;
    --ok:#56d3a0; --ok-soft:#10261e; --ok-line:#1f4a39;
    --warn:#e7b25c; --warn-soft:#2a1f0d; --warn-line:#523d18;
    --bad:#f2837a; --bad-soft:#2b1513; --bad-line:#5a2723;
    --demo:#b79bff; --demo-soft:#1e1733; --demo-line:#3d2f68;
    --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 6px 24px rgba(0,0,0,.45);
  }
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--canvas); color:var(--ink-800);
  font-family:var(--font); font-size:15.5px; line-height:1.78;
  font-variant-numeric:tabular-nums; text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}

/* ── shell ─────────────────────────────────────────────── */
.kr-shell{max-width:1180px;margin:0 auto;padding:32px 24px 96px}
.kr-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:28px}
.kr-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--brand),#7c6cf5);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;letter-spacing:-.02em;
  box-shadow:0 2px 8px rgba(67,56,202,.32)}
.kr-title{font-size:16px;font-weight:650;color:var(--ink-900);letter-spacing:-.01em;margin:0}
.kr-sub{font-size:12.5px;color:var(--ink-500);margin:0}
.kr-spacer{flex:1}

/* segmented control */
.kr-seg{display:inline-flex;background:var(--line-soft);border:1px solid var(--line);
  border-radius:999px;padding:3px;gap:2px}
.kr-seg button{appearance:none;border:0;background:transparent;font:inherit;font-size:13px;
  color:var(--ink-500);padding:5px 15px;border-radius:999px;cursor:pointer;transition:.16s;font-weight:520}
.kr-seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink-900);box-shadow:var(--shadow-1)}
.kr-seg button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

/* ── the response card ─────────────────────────────────── */
.kr-response{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-2);overflow:hidden}
.kr-demo-bar{display:flex;align-items:center;gap:9px;padding:9px 22px;font-size:12.5px;font-weight:600;
  background:var(--demo-soft);color:var(--demo);border-bottom:1px solid var(--demo-line);letter-spacing:.01em}
.kr-demo-bar svg{flex:none}

.kr-body{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:1100px){
  .kr-body{grid-template-columns:minmax(0,1fr) 272px}
  .kr-aside{border-left:1px solid var(--line);background:var(--sunk)}
}
.kr-main{padding:30px 34px 34px;min-width:0}
.kr-aside{padding:26px 22px}
@media (max-width:1099px){.kr-aside{border-top:1px solid var(--line);background:var(--sunk)}}
@media (max-width:640px){.kr-main{padding:22px 18px 26px}.kr-aside{padding:20px 18px}}

/* ── lede ──────────────────────────────────────────────── */
.kr-lede{display:flex;gap:13px;align-items:flex-start;margin:0 0 6px}
.kr-lede-dot{flex:none;width:26px;height:26px;border-radius:8px;background:var(--brand-soft);
  border:1px solid var(--brand-line);display:grid;place-items:center;margin-top:4px}
.kr-lede h1{margin:0;font-size:21px;line-height:1.42;font-weight:660;letter-spacing:-.015em;
  color:var(--ink-900);max-width:var(--measure)}
.kr-confbar{display:flex;align-items:center;gap:10px;margin:14px 0 26px;padding-left:39px;flex-wrap:wrap}

/* badges */
.kr-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:640;
  padding:2.5px 9px;border-radius:999px;border:1px solid;letter-spacing:.02em;white-space:nowrap}
.kr-badge.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.kr-badge.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.kr-badge.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.kr-badge.brand{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand-line)}
.kr-badge.mute{background:var(--line-soft);color:var(--ink-500);border-color:var(--line)}
.kr-badge.demo{background:var(--demo-soft);color:var(--demo);border-color:var(--demo-line)}

/* ── block scaffolding ─────────────────────────────────── */
.kr-block{margin:0 0 30px;max-width:var(--measure)}
.kr-block:last-child{margin-bottom:0}
.kr-h{display:flex;align-items:center;gap:9px;margin:0 0 12px}
.kr-h h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-400)}
.kr-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* prose */
.kr-prose{max-width:var(--measure)}
.kr-prose p{margin:0 0 14px}
.kr-prose p:last-child{margin-bottom:0}
.kr-prose h3{font-size:16.5px;font-weight:640;color:var(--ink-900);margin:26px 0 10px;letter-spacing:-.01em}
.kr-prose strong{font-weight:650;color:var(--ink-900)}
.kr-prose em{font-style:normal;color:var(--brand-ink);font-weight:560}
.kr-prose code{font-family:var(--mono);font-size:.875em;background:var(--line-soft);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--ink-800)}
.kr-prose blockquote{margin:16px 0;padding:2px 0 2px 16px;border-left:3px solid var(--brand-line);color:var(--ink-600)}
.kr-prose ul{margin:0 0 14px;padding-left:20px}
.kr-prose li{margin:0 0 6px}

/* keypoints */
.kr-kp{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.kr-kp li{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start}
.kr-kp .k-dot{width:7px;height:7px;border-radius:50%;margin-top:11px;flex:none}
.kr-kp .k-dot.fact{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.kr-kp .k-dot.inference{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.kr-kp .k-dot.unknown{background:var(--ink-300);box-shadow:0 0 0 3px var(--line-soft)}
.kr-kp .k-text{min-width:0}
.kr-kp .k-kind{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  margin-left:7px;vertical-align:1.5px}
.kr-kp .k-kind.fact{color:var(--ok)} .kr-kp .k-kind.inference{color:var(--warn)}
.kr-kp .k-kind.unknown{color:var(--ink-400)}
.kr-ref{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;margin-left:6px;
  font-size:10.5px;font-weight:700;border-radius:4px;background:var(--brand-soft);color:var(--brand-ink);
  border:1px solid var(--brand-line);cursor:pointer;vertical-align:2px;line-height:1}

/* table */
.kr-tablewrap{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper)}
.kr-table{width:100%;border-collapse:collapse;font-size:14px}
.kr-table caption{caption-side:top;text-align:left;padding:11px 14px;font-size:12.5px;
  color:var(--ink-500);background:var(--sunk);border-bottom:1px solid var(--line)}
.kr-table th,.kr-table td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:top}
.kr-table thead th{font-size:11.5px;font-weight:680;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-500);background:var(--sunk);white-space:nowrap}
.kr-table tbody tr:last-child td{border-bottom:0}
.kr-table tbody tr:hover{background:var(--line-soft)}
.kr-table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kr-table .lead{font-weight:600;color:var(--ink-900)}
.kr-table tr.is-pick{background:var(--ok-soft)}
.kr-table tr.is-pick:hover{background:var(--ok-soft)}
@media (max-width:640px){
  .kr-table,.kr-table tbody,.kr-table tr,.kr-table td{display:block;width:100%}
  .kr-table caption{display:block;width:100%;box-sizing:border-box}
  .kr-table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .kr-table tr{border-bottom:1px solid var(--line);padding:6px 0}
  .kr-table tr:last-child{border-bottom:0}
  .kr-table td{border:0;display:grid;grid-template-columns:38% 1fr;gap:10px;padding:5px 14px}
  .kr-table td::before{content:attr(data-th);font-size:12px;color:var(--ink-500);font-weight:600}
  .kr-table td.num{text-align:left}
}

/* chart */
.kr-chart{border:1px solid var(--line);border-radius:var(--r);padding:18px;background:var(--paper)}
.kr-chart-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px}
.kr-chart-t{font-size:13.5px;font-weight:620;color:var(--ink-900)}
.kr-chart-u{font-size:11.5px;color:var(--ink-400)}
.kr-bars{display:grid;gap:12px}
.kr-bar{display:grid;grid-template-columns:minmax(72px,auto) 1fr auto;gap:12px;align-items:center;font-size:13px}
.kr-bar .lab{color:var(--ink-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kr-bar .track{height:9px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.kr-bar .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),#7c6cf5);
  transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.kr-bar.hi .fill{background:linear-gradient(90deg,var(--ok),#37b98a)}
.kr-bar .val{color:var(--ink-800);font-weight:620;font-variant-numeric:tabular-nums;white-space:nowrap}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.kr-bar .fill{animation:none}}
.kr-spark{width:100%;height:auto;display:block}
.kr-chart-src{margin-top:12px;font-size:11.5px;color:var(--ink-400);border-top:1px dashed var(--line);padding-top:9px}

/* checklist */
.kr-check{display:grid;gap:9px}
.kr-ci{border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;background:var(--paper);
  display:grid;grid-template-columns:22px 1fr;gap:11px;align-items:start}
.kr-ci .box{width:16px;height:16px;border:1.5px solid var(--ink-300);border-radius:5px;margin-top:4px}
.kr-ci .t{font-weight:600;color:var(--ink-900);margin-bottom:5px}
.kr-ci .grid{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-500)}
.kr-ci .grid b{color:var(--ink-700);font-weight:600}

/* timeline */
.kr-tl{position:relative;padding-left:26px}
.kr-tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
.kr-tl-i{position:relative;padding-bottom:20px}
.kr-tl-i:last-child{padding-bottom:0}
.kr-tl-i::before{content:"";position:absolute;left:-23px;top:7px;width:10px;height:10px;border-radius:50%;
  background:var(--paper);border:2.5px solid var(--brand)}
.kr-tl-i .w{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--brand-ink)}
.kr-tl-i .t{font-weight:620;color:var(--ink-900);margin:1px 0 2px}
.kr-tl-i .d{font-size:13px;color:var(--ink-500)}

/* decision */
.kr-dec{border:1px solid var(--brand-line);border-radius:var(--r-lg);overflow:hidden;background:var(--paper)}
.kr-dec-h{padding:14px 18px;background:var(--brand-soft);border-bottom:1px solid var(--brand-line);
  display:flex;align-items:center;gap:10px}
.kr-dec-h .t{font-weight:680;color:var(--brand-ink);font-size:14.5px}
.kr-dec-s{padding:15px 18px;border-bottom:1px solid var(--line-soft)}
.kr-dec-s:last-child{border-bottom:0}
.kr-dec-s .lbl{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}
.kr-dec-s.rec .lbl{color:var(--ok)} .kr-dec-s.against .lbl{color:var(--warn)}
.kr-dec-s.risk .lbl{color:var(--bad)}
.kr-dec-s ul{margin:0;padding-left:19px} .kr-dec-s li{margin-bottom:5px}
.kr-dec-s li:last-child{margin-bottom:0}

/* qa trail */
.kr-qa{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kr-qa-r{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:13px 16px;align-items:start;
  border-bottom:1px solid var(--line-soft);background:var(--paper)}
.kr-qa-r:last-child{border-bottom:0}
.kr-qa-r .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.kr-qa-r.rej .ic{background:var(--bad-soft);color:var(--bad)}
.kr-qa-r.fix .ic{background:var(--warn-soft);color:var(--warn)}
.kr-qa-r.pass .ic{background:var(--ok-soft);color:var(--ok)}
.kr-qa-r .who{font-size:12px;color:var(--ink-500);margin-bottom:2px}
.kr-qa-r .msg{color:var(--ink-800)}

/* callout */
.kr-call{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 16px;border-radius:var(--r);
  border:1px solid;align-items:start;font-size:14px}
.kr-call.info{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink)}
.kr-call.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.kr-call.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.kr-call.blocked{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.kr-call b{display:block;margin-bottom:2px}

/* unknown */
.kr-unk{border:1px dashed var(--line);border-radius:var(--r);padding:15px 17px;background:var(--sunk)}
.kr-unk ul{margin:0;padding-left:19px;color:var(--ink-600)}
.kr-unk li{margin-bottom:6px} .kr-unk li:last-child{margin-bottom:0}
.kr-unk .need{color:var(--ink-900);font-weight:600}

/* evidence */
.kr-ev{display:grid;gap:9px}
.kr-ev-i{display:grid;grid-template-columns:auto 1fr;gap:11px;padding:11px 13px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--paper);font-size:13px;align-items:start}
.kr-ev-i .n{min-width:18px;height:18px;padding:0 4px;display:grid;place-items:center;border-radius:5px;
  background:var(--brand-soft);color:var(--brand-ink);font-size:10.5px;font-weight:700;border:1px solid var(--brand-line)}
.kr-ev-i .ti{color:var(--ink-900);font-weight:580;margin-bottom:3px}
.kr-ev-i .mu{font-size:11.5px;color:var(--ink-400);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.kr-ev-i .u{font-family:var(--mono);font-size:11px;word-break:break-all;color:var(--ink-500)}

/* ask */
.kr-ask{border:1px solid var(--warn-line);background:var(--warn-soft);border-radius:var(--r-lg);padding:18px 20px}
.kr-ask .q{font-size:16px;font-weight:660;color:var(--ink-900);margin:0 0 6px;letter-spacing:-.01em}
.kr-ask .why{font-size:13px;color:var(--warn);margin:0 0 15px}
.kr-ask .opts{display:grid;gap:9px}
.kr-ask .opt{display:grid;grid-template-columns:auto 1fr;gap:11px;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:.15s;text-align:left;font:inherit}
.kr-ask .opt:hover{border-color:var(--brand);box-shadow:var(--shadow-1)}
.kr-ask .opt:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.kr-ask .opt .ring{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-300);margin-top:4px}
.kr-ask .opt .ol{display:block;font-weight:620;color:var(--ink-900)}
.kr-ask .opt .oc{display:block;font-size:12.5px;color:var(--ink-500);margin-top:2px;line-height:1.55}

/* code */
.kr-code{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sunk)}
.kr-code-h{padding:8px 14px;font-size:11.5px;color:var(--ink-500);border-bottom:1px solid var(--line);
  font-family:var(--mono);display:flex;justify-content:space-between}
.kr-code pre{margin:0;padding:14px;overflow-x:auto;font-family:var(--mono);font-size:12.8px;line-height:1.7;color:var(--ink-800)}

/* aside: meta */
.kr-aside h3{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-400);margin:0 0 12px}
.kr-meta{display:grid;gap:11px;font-size:13px;margin-bottom:24px}
.kr-meta .row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
.kr-meta .row i{font-style:normal;color:var(--ink-400);font-size:12px;white-space:nowrap}
.kr-meta .row span{color:var(--ink-800);text-align:right;font-weight:560}
.kr-mem{display:grid;gap:6px}
.kr-mem .m{font-size:12.5px;color:var(--ink-600);background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:7px 10px}
.kr-quota{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
.kr-quota i{display:block;height:100%;background:var(--brand);border-radius:999px}

/* density */
[data-density="summary"] .kr-only-full{display:none}
@media (min-width:1100px){
  [data-density="summary"] .kr-body{grid-template-columns:minmax(0,1fr)}
  [data-density="summary"] .kr-main{max-width:840px;margin-inline:auto}
}

/* harness panel */
.kr-harness{margin-top:26px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--shadow-1)}
.kr-harness-h{display:flex;align-items:center;gap:11px;padding:13px 20px;border-bottom:1px solid var(--line);background:var(--sunk)}
.kr-harness-h .t{font-size:13.5px;font-weight:660;color:var(--ink-900)}
.kr-harness-b{padding:6px 20px 18px}
.kr-rule{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.kr-rule:last-child{border-bottom:0}
.kr-rule .st{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:800}
.kr-rule.pass .st{background:var(--ok-soft);color:var(--ok)}
.kr-rule.fail .st{background:var(--bad-soft);color:var(--bad)}
.kr-rule.warn .st{background:var(--warn-soft);color:var(--warn)}
.kr-rule .id{font-family:var(--mono);font-size:11px;color:var(--ink-400)}
.kr-rule .ds{color:var(--ink-700)}
.kr-rule .fx{font-size:12px;color:var(--bad)}

/* ── 进度块（PROGRESS 信封，由 KernMissionEvent 流驱动）────── */
.kr-prog{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);overflow:hidden}
.kr-prog-h{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--sunk)}
.kr-prog-n{font-size:13px;font-weight:700;color:var(--ink-900);font-variant-numeric:tabular-nums}
.kr-prog-track{flex:1;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.kr-prog-track i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--brand),#7c6cf5);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.kr-prog-steps{display:grid}
.kr-ps{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.kr-ps:last-child{border-bottom:0}
.kr-ps .dot{width:9px;height:9px;border-radius:50%;margin-top:8px;background:var(--ink-300)}
.kr-ps.running .dot{background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);animation:krPulse 1.3s ease-in-out infinite}
.kr-ps.done .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.kr-ps.blocked .dot{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.kr-ps.skipped .dot{background:var(--ink-300);opacity:.5}
.kr-ps .hd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.kr-ps .hd b{font-weight:620;color:var(--ink-900)}
.kr-ps .ag{font-size:12px;color:var(--ink-400)}
.kr-ps .el{font-size:11.5px;color:var(--ink-400);font-variant-numeric:tabular-nums;margin-left:auto}
.kr-ps .dl{font-size:13.5px;color:var(--ink-600);margin-top:4px;white-space:pre-wrap}
.kr-ps .dl.typing::after{content:"";display:inline-block;width:2px;height:1em;margin-left:2px;
  background:var(--brand);vertical-align:-2px;animation:krCaret 1s steps(1) infinite}
.kr-ps.queued{opacity:.55}
@keyframes krPulse{0%,100%{box-shadow:0 0 0 4px var(--brand-soft)}50%{box-shadow:0 0 0 7px transparent}}
@keyframes krCaret{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .kr-ps.running .dot{animation:none}
  .kr-ps .dl.typing::after{animation:none}
}

/* ── 澄清块（BRIEF 信封）──────────────────────────────────── */
.kr-clar{display:grid;gap:18px}
.kr-q{display:grid;grid-template-columns:auto 1fr;gap:12px}
.kr-q-n{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;margin-top:3px;
  background:var(--brand-soft);color:var(--brand-ink);border:1px solid var(--brand-line);
  font-size:11.5px;font-weight:700}
.kr-q-a{font-weight:620;color:var(--ink-900)}
.kr-q-a small{font-weight:400;font-size:12.5px;color:var(--ink-400);margin-left:8px}
.kr-q-mem{margin-top:6px;font-size:13px;color:var(--ink-600);background:var(--sunk);
  border:1px dashed var(--line);border-radius:var(--r-sm);padding:7px 11px}
.kr-q-mem b{color:var(--ink-800);font-weight:620}
.kr-q-opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.kr-q-opts button{appearance:none;font:inherit;font-size:13.5px;cursor:pointer;
  padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
  color:var(--ink-700);transition:.15s}
.kr-q-opts button:hover{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-soft)}
.kr-q-opts button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

/* ── 诚实失败态 ──────────────────────────────────────────── */
.kr-failed{padding:20px 22px;display:grid;gap:14px}
.kr-fail-list{margin:0;padding-left:20px;font-size:13px;color:var(--ink-500)}
.kr-fail-list li{margin-bottom:5px}

/* ── 布局补丁 ────────────────────────────────────────────── */
.kr-confbar .kr-spacer{flex:1}
.kr-mem .m.is-empty{color:var(--ink-400)}

/* print */
@media print{
  body{background:#fff}
  .kr-top,.kr-harness{display:none}
  .kr-response{box-shadow:none;border:0}
  .kr-only-full{display:block !important}
  .kr-ev-i .u::after{content:" (" attr(data-url) ")"}
}
</style>
</head>
<body>
<div class="kr-shell">

  <header class="kr-top">
    <div class="kr-mark">K</div>
    <div>
      <p class="kr-title">Kern 回复呈现框架</p>
      <p class="kr-sub">Response Envelope → 排版渲染器 → 规范 harness · v1</p>
    </div>
    <div class="kr-spacer"></div>
    <div class="kr-seg" role="group" aria-label="信息密度">
      <button type="button" data-d="summary" aria-pressed="true">摘要</button>
      <button type="button" data-d="full" aria-pressed="false">完整</button>
    </div>
  </header>

  <main id="out" data-density="summary"></main>
  <section id="harness"></section>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   1. ICONS
   ═══════════════════════════════════════════════════════════ */
const svg = (d, w = 14) =>
  `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  spark: svg('<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'),
  flask: svg('<path d="M9 3h6M10 3v6L5 19a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 19l-5-10V3"/>'),
  check: svg('<path d="M20 6 9 17l-5-5"/>'),
  alert: svg('<path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>'),
  scale: svg('<path d="M12 3v18M5 7h14M7 7l-3 7h6ZM17 7l-3 7h6Z"/>'),
  eye:   svg('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>'),
  hand:  svg('<path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2a8 8 0 0 1-8-8"/>'),
};

/* ═══════════════════════════════════════════════════════════
   2. RENDERER  (Envelope → DOM)
   ═══════════════════════════════════════════════════════════ */
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 极小的安全内联格式：**粗** *强调* `码` [n] 引用角标
const inl = (s) => esc(s)
  .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
  .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\[(\d+)\]/g, '<button class="kr-ref" data-ref="$1" title="查看来源 $1">$1</button>');

const sec = (title, inner, full = false) =>
  `<section class="kr-block${full ? " kr-only-full" : ""}">
     ${title ? `<div class="kr-h"><h2>${esc(title)}</h2></div>` : ""}${inner}</section>`;

const BLOCK = {
  prose: (b) => sec(b.title, `<div class="kr-prose">${b.body.map((p) =>
      p.startsWith("### ") ? `<h3>${inl(p.slice(4))}</h3>`
    : p.startsWith("> ")   ? `<blockquote>${inl(p.slice(2))}</blockquote>`
    : `<p>${inl(p)}</p>`).join("")}</div>`, b.full),

  keypoints: (b) => sec(b.title, `<ul class="kr-kp">${b.items.map((it) => `
      <li><span class="k-dot ${it.kind}"></span>
        <span class="k-text">${inl(it.text)}<span class="k-kind ${it.kind}">${
          { fact: "事实", inference: "推断", unknown: "未知" }[it.kind]}</span></span></li>`).join("")}</ul>`, b.full),

  table: (b) => sec(b.title, `<div class="kr-tablewrap"><table class="kr-table">
      ${b.caption ? `<caption>${inl(b.caption)}</caption>` : ""}
      <thead><tr>${b.cols.map((c) => `<th scope="col"${c.num ? ' class="num"' : ""}>${esc(c.label)}</th>`).join("")}</tr></thead>
      <tbody>${b.rows.map((r) => `<tr${r.pick ? ' class="is-pick"' : ""}>${r.cells.map((cell, i) =>
        `<td data-th="${esc(b.cols[i].label)}" class="${b.cols[i].num ? "num" : ""}${i === 0 ? " lead" : ""}">${inl(cell)}</td>`
      ).join("")}</tr>`).join("")}</tbody></table></div>`, b.full),

  chart: (b) => {
    const max = Math.max(...b.series.map((s) => s.value));
    const bars = b.series.map((s) => `
      <div class="kr-bar ${s.hi ? "hi" : ""}">
        <span class="lab">${esc(s.label)}</span>
        <span class="track"><i class="fill" style="display:block;width:${(s.value / max * 100).toFixed(1)}%"></i></span>
        <span class="val">${esc(s.display ?? s.value)}</span>
      </div>`).join("");
    return sec(b.title, `<div class="kr-chart">
      <div class="kr-chart-h"><span class="kr-chart-t">${esc(b.label)}</span><span class="kr-chart-u">${esc(b.unit)}</span></div>
      <div class="kr-bars">${bars}</div>
      <div class="kr-chart-src">${inl(b.source)}</div></div>`, b.full);
  },

  checklist: (b) => sec(b.title, `<div class="kr-check">${b.items.map((it) => `
      <div class="kr-ci"><span class="box"></span><div>
        <div class="t">${inl(it.hypothesis)}</div>
        <div class="grid">
          <span><b>方法</b> ${esc(it.method)}</span><span><b>通过线</b> ${esc(it.gate)}</span>
          <span><b>周期</b> ${esc(it.duration)}</span><span><b>预算</b> ${esc(it.budget)}</span>
        </div></div></div>`).join("")}</div>`, b.full),

  timeline: (b) => sec(b.title, `<div class="kr-tl">${b.items.map((it) => `
      <div class="kr-tl-i"><div class="w">${esc(it.when)}</div>
        <div class="t">${esc(it.phase)}</div><div class="d">${inl(it.deliverable)}</div></div>`).join("")}</div>`, b.full),

  decision: (b) => sec(b.title, `<div class="kr-dec">
      <div class="kr-dec-h">${I.scale}<span class="t">${esc(b.headline)}</span>
        <span class="kr-badge ${{ HIGH: "ok", MEDIUM: "warn", LOW: "bad" }[b.confidence]}">置信度 ${
          { HIGH: "高", MEDIUM: "中", LOW: "低" }[b.confidence]}</span></div>
      <div class="kr-dec-s rec"><div class="lbl">${I.check} 推荐</div><ul>${b.recommend.map((x) => `<li>${inl(x)}</li>`).join("")}</ul></div>
      <div class="kr-dec-s against"><div class="lbl">${I.eye} 反对理由</div><ul>${b.against.map((x) => `<li>${inl(x)}</li>`).join("")}</ul></div>
      <div class="kr-dec-s risk"><div class="lbl">${I.alert} 风险</div><ul>${b.risks.map((x) => `<li>${inl(x)}</li>`).join("")}</ul></div>
    </div>`, b.full),

  qa: (b) => sec(b.title, `<div class="kr-qa">${b.trail.map((t) => `
      <div class="kr-qa-r ${t.verdict}">
        <span class="ic">${{ rej: "✕", fix: "↻", pass: "✓" }[t.verdict]}</span>
        <div><div class="who">${esc(t.who)} · 第 ${t.round} 轮</div><div class="msg">${inl(t.message)}</div></div>
      </div>`).join("")}</div>`, b.full),

  callout: (b) => sec(null, `<div class="kr-call ${b.tone}">${
      { info: I.spark, ok: I.check, warn: I.alert, blocked: I.alert }[b.tone]
    }<div><b>${esc(b.title)}</b>${inl(b.body)}</div></div>`, b.full),

  unknown: (b) => sec(b.title || "还不知道的事", `<div class="kr-unk"><ul>${b.items.map((it) =>
      `<li><span class="need">${esc(it.question)}</span> — 需要：${esc(it.needs)}</li>`).join("")}</ul></div>`, b.full),

  evidence: (b) => sec(b.title || "来源", `<div class="kr-ev">${b.items.map((it) => `
      <div class="kr-ev-i" id="ref-${it.n}"><span class="n">${it.n}</span>
        <div><div class="ti">${esc(it.title)}</div>
          <div class="mu">
            <span class="kr-badge ${{ trusted: "ok", untrusted: "warn", internal: "brand", demo: "demo" }[it.trust]}">${
              { trusted: "可信", untrusted: "外部未验证", internal: "内部", demo: "演示" }[it.trust]}</span>
            <span>抓取于 ${esc(it.fetchedAt)}</span></div>
          <div class="u" data-url="${esc(it.url)}">${esc(it.url)}</div></div></div>`).join("")}</div>`, true),

  code: (b) => sec(b.title, `<div class="kr-code"><div class="kr-code-h"><span>${esc(b.lang)}</span><span>${esc(b.note || "")}</span></div><pre>${esc(b.body)}</pre></div>`, b.full),

  progress: (b) => sec(b.title || "进行中", `<div class="kr-prog">
      <div class="kr-prog-h">
        <span class="kr-prog-n">${b.done}/${b.total}</span>
        <span class="kr-prog-track"><i style="width:${(b.done / Math.max(b.total,1) * 100).toFixed(1)}%"></i></span>
        ${b.paused ? '<span class="kr-badge warn">已暂停</span>' : ""}
      </div>
      <div class="kr-prog-steps">${b.steps.map((s) => `
        <div class="kr-ps ${s.state}"><span class="dot"></span><div>
          <div class="hd"><b>${esc(s.label)}</b><span class="ag">${esc(s.agent)}</span>${
            s.elapsedMs != null ? `<span class="el">${(s.elapsedMs/1000).toFixed(1)}s</span>` : ""}</div>
          ${s.delta ? `<div class="dl${s.state === "running" ? " typing" : ""}">${esc(s.delta)}</div>` : ""}
        </div></div>`).join("")}</div></div>`, b.full),

  clarify: (b) => sec(b.title || "开工前确认几件事", `<div class="kr-clar">${b.questions.map((q,i) => `
      <div class="kr-q"><span class="kr-q-n">${i+1}</span><div>
        <div class="kr-q-a">${esc(q.ask)} <small>${esc(q.why)}</small></div>
        ${q.remembered ? `<div class="kr-q-mem"><b>我记得：</b>${esc(q.remembered)}</div>` : ""}
        <div class="kr-q-opts">${q.options.map((o) => `<button type="button">${esc(o)}</button>`).join("")}</div>
      </div></div>`).join("")}</div>`, b.full),

};

function renderAside(m, demo) {
  const q = m.quota;
  return `
    <h3>这次花了什么</h3>
    <div class="kr-meta">
      <div class="row"><i>模型</i><span>${esc(m.model)}</span></div>
      <div class="row"><i>步骤</i><span>${m.steps} 步</span></div>
      <div class="row"><i>耗时</i><span>${(m.elapsedMs / 1000).toFixed(1)} 秒</span></div>
      <div class="row"><i>来源</i><span>${m.sources} 条</span></div>
      <div class="row"><i>额度</i><span>${demo ? "不计额度" : `${q.used}/${q.limit}`}</span></div>
      ${demo ? "" : `<div class="kr-quota"><i style="width:${(q.used / q.limit * 100).toFixed(0)}%"></i></div>`}
    </div>
    <h3>用到的记忆</h3>
    <div class="kr-mem">${m.memoriesUsed.length
      ? m.memoriesUsed.map((x) => `<div class="m">${esc(x)}</div>`).join("")
      : '<div class="m" style="color:var(--ink-400)">这次没有用到你的记忆</div>'}</div>`;
}

function render(env, mount) {
  const confMap = { HIGH: ["ok", "置信度 高"], MEDIUM: ["warn", "置信度 中"], LOW: ["bad", "置信度 低"] };
  const [ct, cl] = confMap[env.confidence];
  mount.innerHTML = `
    <article class="kr-response">
      ${env.demo ? `<div class="kr-demo-bar">${I.flask}演示数据 · 不代表真实调研结论，不写入业务数据，不消耗额度</div>` : ""}
      <div class="kr-body">
        <div class="kr-main">
          <div class="kr-lede"><span class="kr-lede-dot" style="color:var(--brand)">${I.spark}</span>
            <h1>${inl(env.lede)}</h1></div>
          <div class="kr-confbar">
            <span class="kr-badge ${ct}">${cl}</span>
            <span class="kr-badge mute">${env.meta.steps} 位成员参与</span>
            ${env.demo ? '<span class="kr-badge demo">演示数据</span>' : ""}
          </div>
          ${env.blocks.map((b) => (BLOCK[b.type] ? BLOCK[b.type](b) : "")).join("")}
          ${env.ask ? `
          <section class="kr-block"><div class="kr-ask">
            <p class="q">${inl(env.ask.question)}</p>
            <p class="why">${I.hand} ${esc(env.ask.why_you)}</p>
            <div class="opts">${env.ask.options.map((o) => `
              <button type="button" class="opt"><span class="ring"></span>
                <span><span class="ol">${esc(o.label)}</span><span class="oc">${esc(o.consequence)}</span></span></button>`).join("")}</div>
          </div></section>` : ""}
        </div>
        <aside class="kr-aside kr-only-full">${renderAside(env.meta, env.demo)}</aside>
      </div>
    </article>`;
  mount.querySelectorAll(".kr-ref").forEach((b) => b.addEventListener("click", () => {
    document.documentElement.setAttribute("data-jump", "1");
    document.getElementById("out").dataset.density = "full";
    syncSeg("full");
    const t = document.getElementById("ref-" + b.dataset.ref);
    if (t) { t.scrollIntoView({ behavior: "smooth", block: "center" }); t.style.borderColor = "var(--brand)"; }
  }));
}

/* ═══════════════════════════════════════════════════════════
   3. HARNESS — 规范校验（对应 KERN_RESPONSE_SPEC.md §4）
   ═══════════════════════════════════════════════════════════ */
const BANNED = /作为一个\s*AI|作为一名\s*AI|我无法|希望(这|对你)(有|能)?帮助|总而言之，我|抱歉，我只是/;

const RULES = [
  { id: "R1", desc: "lede 存在且 ≤ 60 字", level: "error",
    run: (e) => e.lede && e.lede.length <= 60 || `lede ${e.lede ? e.lede.length + " 字，超长" : "缺失"}` },
  { id: "R2", desc: "每条要点标注 fact / inference / unknown", level: "error",
    run: (e) => { const bad = e.blocks.filter((b) => b.type === "keypoints")
        .flatMap((b) => b.items).filter((i) => !["fact", "inference", "unknown"].includes(i.kind));
      return bad.length === 0 || `${bad.length} 条要点未标注`; } },
  { id: "R3", desc: "事实必须带来源角标 [n]", level: "error",
    run: (e) => { const ev = e.blocks.some((b) => b.type === "evidence");
      const facts = e.blocks.filter((b) => b.type === "keypoints").flatMap((b) => b.items).filter((i) => i.kind === "fact");
      const naked = facts.filter((f) => !/\[\d+\]/.test(f.text));
      if (!facts.length) return true;
      if (!ev) return `有 ${facts.length} 条事实但没有 evidence 块`;
      return naked.length === 0 || `${naked.length} 条事实没有来源角标`; } },
  { id: "R4", desc: "决策卡三段齐全（推荐/反对/风险）", level: "error",
    run: (e) => { const d = e.blocks.find((b) => b.type === "decision");
      if (!d) return true;
      const miss = ["recommend", "against", "risks"].filter((k) => !d[k] || !d[k].length);
      return miss.length === 0 || `缺 ${miss.join(" / ")}`; } },
  { id: "R5", desc: "段落 ≤ 280 字", level: "warn",
    run: (e) => { const long = e.blocks.filter((b) => b.type === "prose").flatMap((b) => b.body).filter((p) => p.length > 280);
      return long.length === 0 || `${long.length} 段超长`; } },
  { id: "R6", desc: "表格 ≤ 6 列且数值列右对齐", level: "error",
    run: (e) => { const t = e.blocks.filter((b) => b.type === "table");
      const wide = t.filter((b) => b.cols.length > 6);
      return wide.length === 0 || `${wide.length} 张表超过 6 列`; } },
  { id: "R7", desc: "meta 含 model / elapsedMs / quota", level: "error",
    run: (e) => { const miss = ["model", "elapsedMs", "quota"].filter((k) => e.meta[k] == null);
      return miss.length === 0 || `缺 ${miss.join(" / ")}`; } },
  { id: "R8", desc: "demo=true 时必须有演示标识且不占额度", level: "error",
    run: (e) => !e.demo || (e.meta.quota && e.meta.quota.used === e.meta.quota.usedBefore) || e.demo === true },
  { id: "R9", desc: "正文无 AI 套话", level: "error",
    run: (e) => { const all = JSON.stringify(e);
      const m = all.match(BANNED); return !m || `命中「${m[0]}」`; } },
  { id: "R10", desc: "UNKNOWN 必须写清缺什么源", level: "error",
    run: (e) => { const u = e.blocks.find((b) => b.type === "unknown");
      const unk = e.blocks.filter((b) => b.type === "keypoints").flatMap((b) => b.items).filter((i) => i.kind === "unknown");
      if (!unk.length) return true;
      return (u && u.items.every((i) => i.needs)) || "有 unknown 要点但缺少 unknown 块或 needs 字段"; } },
  { id: "R11", desc: "需要人拍板时必须说明「为什么是你」", level: "error",
    run: (e) => !e.ask || !!e.ask.why_you || "ask 缺 why_you" },
  { id: "R12", desc: "正文不含 emoji", level: "warn",
    run: (e) => { const t = e.blocks.filter((b) => b.type === "prose").flatMap((b) => b.body).join("");
      return !/\p{Extended_Pictographic}/u.test(t) || "正文出现 emoji"; } },
];

function validate(env) {
  return RULES.map((r) => {
    let res;
    try { res = r.run(env); } catch (err) { res = "校验异常: " + err.message; }
    return { ...r, ok: res === true, detail: res === true ? "" : res };
  });
}

function renderHarness(env, mount) {
  const rs = validate(env);
  const errs = rs.filter((r) => !r.ok && r.level === "error").length;
  const warns = rs.filter((r) => !r.ok && r.level === "warn").length;
  mount.innerHTML = `
    <div class="kr-harness">
      <div class="kr-harness-h">
        <span style="color:${errs ? "var(--bad)" : "var(--ok)"}">${errs ? I.alert : I.check}</span>
        <span class="t">规范 harness</span>
        <span class="kr-badge ${errs ? "bad" : "ok"}">${errs ? errs + " 项阻断" : "全部通过"}</span>
        ${warns ? `<span class="kr-badge warn">${warns} 项提醒</span>` : ""}
        <span style="flex:1"></span>
        <span style="font-size:12px;color:var(--ink-400)">KERN_RESPONSE_SPEC.md §4</span>
      </div>
      <div class="kr-harness-b">
        ${rs.map((r) => `
          <div class="kr-rule ${r.ok ? "pass" : r.level === "error" ? "fail" : "warn"}">
            <span class="st">${r.ok ? "✓" : r.level === "error" ? "✕" : "!"}</span>
            <span><span class="id">${r.id}</span> <span class="ds">${esc(r.desc)}</span></span>
            <span class="fx">${esc(r.detail)}</span>
          </div>`).join("")}
      </div>
    </div>`;
}
